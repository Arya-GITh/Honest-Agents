[project]
name = "agent-honesty"
version = "0.1.0"
description = "Execution integrity and trajectory authenticity middleware for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Truthify Team" }
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_honesty"]
