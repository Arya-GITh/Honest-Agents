[project]
name = "agent-honesty"
version = "0.1.0"
description = "Execution integrity and trajectory authenticity governance middleware for autonomous AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = [
    "ai-agents",
    "execution-integrity",
    "hallucination-detection",
    "llm-guardrails",
    "mcp",
    "model-context-protocol",
    "react-agents",
    "verification",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
authors = [
    { name = "Truthify Team" }
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Arya-GITh/Truthify"
Repository = "https://github.com/Arya-GITh/Truthify.git"
Issues = "https://github.com/Arya-GITh/Truthify/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
crewai = [
    "crewai>=0.80.0",
]
autogen = [
    "autogen-agentchat>=0.2.0",
]
llamaindex = [
    "llama-index-core>=0.11.0",
]
all = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "crewai>=0.80.0",
    "autogen-agentchat>=0.2.0",
    "llama-index-core>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_honesty"]
