[project]
name = "agent-honesty-monorepo"
version = "0.1.0"
description = "Monorepo workspace for agent-honesty execution integrity platform"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.pytest.ini_options]
pythonpath = [".", "packages/agent-honesty/src"]
