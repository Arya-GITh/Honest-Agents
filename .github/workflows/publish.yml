name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
      - "agent-honesty-v*"
      - "agent-honesty-adapters-v*"
      - "deceptionbench-v*"
      - "agent-honesty-sandbox-v*"
      - "agent-honesty-interp-v*"

jobs:
  publish-agent-honesty:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/agent-honesty-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build agent-honesty
        run: |
          cd packages/agent-honesty
          uv build

      - name: Publish agent-honesty to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/agent-honesty/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
